# Balanced profile: mirrors the current production-tuned default configuration.
prefix: '&6[VezAC] &r'
anticheat:
  enabled: true
flags:
  format: '{prefix}&e{player} &7failed &c{check} &7(&fVL {vl}&7)'
  staff-default-on: true
messages:
  no-permission: '{prefix}&cNo permission.'
  flags-on: '{prefix}&aAlerts enabled.'
  flags-off: '{prefix}&cAlerts disabled.'
  enabled: '{prefix}&aVezAntiCheat enabled.'
  disabled: '{prefix}&cVezAntiCheat disabled.'
  reload: '{prefix}&aReloaded config.'

lag:
  enable-gates: true
  max-ping: 250
  min-tps: 18.5

knockback-profile:
  horizontal: 0.4
  vertical: 0.389
  vertical-limit: 0.4
  extra-horizontal: 0.5
  extra-vertical: 0.1

exempt:
  teleport-ms: 900
  velocity-ms: 450
  blockstate-ms: 350
  potion-ms: 500

combat-analysis:
  attack-window-ms: 325
  rewind-base-ms: 70
  rewind-ping-factor: 0.25
  max-rewind-ms: 180
  trade-window-ms: 450
  combo-window-ms: 800
  jump-reset-window-ms: 220
  blockhit-window-ms: 250
  walk-through-distance: 1.10
  packet-burst-ms: 110
  packet-burst-jitter-ms: 18.0
  high-jitter-ms: 12.0
  stale-move-ms: 150
  stale-rotation-ms: 140
  stale-swing-ms: 180
  trade-depth-window-ms: 1200
  spacing-shift-threshold: 0.28
  triple-hit-fast-ms: 350
  triple-hit-delay-ms: 525
  hit-select:
    parry-min-ms: 100
    parry-max-ms: 250
    quarter-min-ms: 500
    quarter-max-ms: 1000
    deep-min-ms: 1000
  rewind:
    live-position-fallback-expansion-bonus: 0.04
  required-rotation:
    median-threshold-deg: 12.0
    min-samples: 8

engine:
  compensation:
    leniency-budget-cap: 0.12
  unverified:
    horizontal-accrual-floor: 0.20
    max-ticks: 20
  exemption-caps:
    block-change-max-ticks: 6
    block-change-window-ms: 2000
    combat-grace-max-ticks: 8
    combat-grace-window-ms: 2000
  vehicle:
    boat-max-per-tick: 0.65
    minecart-max-per-tick: 0.50
    default-max-per-tick: 0.55
    tolerance: 1.15
    buffer-to-flag: 4

license:
  enabled: false
  key: ''
  grace-hours: 24
  validation-url: ''

updates:
  check-enabled: false
  manifest-url: ''

diagnostics:
  perf-sampling-enabled: false

combat-mitigation:
  enabled: true
  drop-hits-on-flag: true
  punitive-setback: true
  push-blocks: 0.40
  teleport-exempt-ms: 250
  min-confidence-for-setback: moderate

setback-blocker:
  max-pending-ms: 2000

movement-analysis:
  packet-burst-ms: 110
  high-jitter-ms: 12.0
  jump-window-ms: 220
  velocity-window-ms: 500
  combat-window-ms: 400
  block-place-window-ms: 250

scaffold-analysis:
  low-move-threshold: 0.05

punish:
  enabled: true
  ban-vl: 25
  mode: CHECK
  execution:
    type: BANWAVE
    auto-banwave:
      enabled: true
      interval-seconds: 30
      min-delay-seconds: 900
      max-delay-seconds: 7200
      batch-size: 8
  evidence:
    mark-score: 8.0
    queue-score: 12.0
    recent-window-seconds: 600
    multi-check-bonus: 1.75
    triple-check-bonus: 2.5
    global-vl: 35
    global-bonus: 1.5
    marked-bonus: 1.75
    fast-flags:
      count: 6
      window-seconds: 90
      bonus: 2.5
    default: MEDIUM
    confidence:
      HIGH:
        min-check-vl: 5.0
        score: 4.75
        max-contribution: 9.5
      MEDIUM:
        min-check-vl: 7.5
        score: 3.0
        max-contribution: 6.0
      LOW:
        min-check-vl: 10.0
        score: 1.75
        max-contribution: 3.5
    categories:
      REACH: HIGH
      BACKTRACK: HIGH
      FLY: HIGH
      KILLAURA: MEDIUM
      SCAFFOLD: MEDIUM
      VELOCITY: MEDIUM
      SPEED: MEDIUM
      PHASE: MEDIUM
      BADPACKETS: MEDIUM
      AIMASSIST: LOW
      AUTOCLICK: LOW
      TIMER: LOW
      NOROTATION: LOW
      BLINK: LOW
      INVENTORY: LOW
      MISC: MEDIUM
    overrides:
      ReachA: HIGH
      ReachB: HIGH
      ReachC: MEDIUM
      BackTrackA: HIGH
      FlyA: HIGH
      FlyB: HIGH
      FlyC: HIGH
      FlyD: HIGH
      FlyE: HIGH
      ScaffoldA: MEDIUM
