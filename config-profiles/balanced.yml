      AimAssistB: LOW
      AimAssistC: LOW
      AutoClickA: LOW
      AutoClickB: LOW
      AutoClickC: LOW
  ladder:
    '1':
      type: TEMP
      duration: 30d
    '2':
      type: TEMP
      duration: 90d
    '3':
      type: TEMP
      duration: 365d
    '4':
      type: PERM
  watchdog:
    reason: Cheating through the use of unfair game advantages.
    appeal-url: https://www.hypixel.net/appeal
    broadcast: '&c[VezAC] has banned {player} for cheating!'
    remove-message: '&eA player has been removed from your game.'
  reasons:
    REACH: Cheating
    BACKTRACK: Cheating
    KILLAURA: Cheating
    VELOCITY: Cheating
    AUTOCLICK: Cheating
    AIMASSIST: Cheating
