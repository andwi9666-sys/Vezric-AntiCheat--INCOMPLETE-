# =============================================================================
# Perplexion AntiCheat — Server Config (config.yml)
# =============================================================================
# Global plugin settings: engines, lag gates, punishments, messages.
#
# PER-CHECK TUNING lives in the tiers/ YAML files (enabled, shadow, vl,
# bufferToFlag, thresholds).
# Reload everything: /perplexion reload   (aliases: /pe, /vez)
# Live tune a check: /perplexion tune <CheckName> <key> [value]
# =============================================================================

config-version: 18

# Optional license gate for direct premium sales (disabled for marketplace builds)
license:
  enabled: false
  key: ''
  grace-hours: 24
  validation-url: ''

# Optional update manifest check (surfaced in /perplexion status)
updates:
  check-enabled: false
  manifest-url: ''

diagnostics:
  perf-sampling-enabled: false

# Polar tier system settings
tier:
  vl-decay-grace-ms: 15000
  setback-blatant-offset: 0.15
  # Scheduled global VL decay sweep (online players x checks). Without this, per-check VL never
  # decays globally — only inside per-check decay() hooks that most checks never call.
  vl-decay-task:
    enabled: true
    interval-ticks: 20  # 20 ticks = 1s; decay rate per check is each check's "decay" key

# Player-vs-player combat cheat mitigation: drop hits + punitive setback (no movement correction)
combat-mitigation:
  enabled: true
  drop-hits-on-flag: true
  punitive-setback: true
  push-blocks: 0.40
  teleport-exempt-ms: 250
  min-confidence-for-setback: high

# Chat prefix used in {prefix} placeholders below
prefix: '&0&l[PE&7RPLEX&8ION] '

# Master anticheat switch (/perplexion on|off also toggles this)
anticheat:
  enabled: true  # false = all checks stop flagging

# Simulation setback aggressiveness when prediction flags
simulation:
  enabled: true  # Enable simulation-based setbacks
  mitigation-strategy: CAREFUL  # AGGRESSIVE | CAREFUL | LENIENT | SILENT

# Staff alert formatting
flags:
  format: '{prefix}&c{player} &7failed &4{check} &7[{tier}] (&4VL {vl}&7)'  # check=check name, tier=Prism/Prediction/etc.
  staff-default-on: true  # New staff see alerts without running /flags

messages:
  no-permission: '{prefix}&cNo permission.'
  flags-on: '{prefix}&aAlerts enabled.'
  flags-off: '{prefix}&cAlerts disabled.'
  enabled: '{prefix}&aPerplexion enabled.'
  disabled: '{prefix}&cPerplexion disabled.'
  reload: '{prefix}&aReloaded config.'
# Skip detections when server or player connection is unstable
lag:
  enable-gates: true   # true = disable checks above max-ping or below min-tps
  max-ping: 250        # Players above this ping (ms) are not checked
  min-tps: 18.5        # Server below this TPS disables checks
  profile:
    suspicious-gap-ms: 160
    base-gap-allowance-ms: 115
    ping-factor: 0.55
    jitter-factor: 1.8
    trusted-ping-max: 190
    trusted-jitter-max: 22.0
    burst-threshold-ms: 18
    burst-window-ms: 700
    min-burst-packets: 4
    attack-window-ms: 900
    velocity-window-ms: 650
    active-window-ms: 4500
    decay-per-second: 0.28
    counter-reset-ms: 12000
    boost-start-score: 1.25
    boost-factor: 0.18
    max-boost: 0.75
    selective-start-score: 1.35
    combat-cover-window-ms: 1400
    velocity-cover-window-ms: 1200
    velocity-cover-score: 1.15
    buffer-bonus-low-score: 1.4
    buffer-bonus-high-score: 2.8
    combat-teleport:
      focus-window-ms: 2200
      intent-window-ms: 900
      fallback-range: 6.5
      min-ping-samples: 8
      trusted-ping-max: 185
      trusted-jitter-max: 18.0
      min-gap-ms: 170
      gap-excess-ms: 25
      min-start-distance: 4.6
      max-end-distance: 3.8
      default-legit-per-tick: 0.36
      min-move-h: 1.15
      min-move-over-legit: 0.40
      min-close-delta: 1.30
      min-closure-ratio: 0.72
      window-ms: 9000
      max-samples: 16
      score-gain: 1.15
      close-bonus-factor: 0.22
      max-close-bonus: 0.75
      max-score: 10.0
      active-min-events: 2
      active-score-factor: 0.45
      active-max-bonus: 1.65
      selective-min-events: 2
# Vanilla 1.8 knockback envelope used to scale reach/velocity tolerances
knockback-profile:
  horizontal: 0.4        # Base horizontal KB strength
  vertical: 0.389      # Base vertical KB strength
  vertical-limit: 0.4  # Max vertical KB before clamp
  extra-horizontal: 0.5  # Sprint/KB combo horizontal allowance
  extra-vertical: 0.1    # Extra vertical KB allowance

# Anti-knockback / velocity prediction engine
velocity-engine:
  enabled: true  # Master switch for VelocityA-D and VelocityPrediction
  debug: false
  prediction-ticks: 8
  evaluation-window-base-ms: 320
  evaluation-window-ping-factor: 0.25
  evaluation-window-max-ms: 550
  combat-velocity-ms: 350
  stack-window-ms: 120
  jump-reset-window-ms: 220
  horizontal-tolerance: 0.18
  vertical-tolerance: 0.14
  min-track-horizontal: 0.06
  min-track-vertical: 0.08
  physics:
    gravity: 0.08
    air-drag: 0.91
    ground-friction: 0.6
    sprint-assist: 0.06
    jump-velocity: 0.42
    counter-input: 0.20
  leniency:
    max-ping: 250
    min-tps: 18.5
  setback:
    enabled: true
    cooldown-ms: 0
    min-confidence: 0.82
    # Route anti-knockback enforcement through the unified GrimAC movement setback (teleport to last-good
    # + re-send the expected knockback) instead of the legacy animated replay. Set false to fall back to
    # the VelocityKnockbackAnimator path.
    use-grim-setback: true
# Global exemption windows after legit server events (reduces false positives)
exempt:
  teleport-ms: 900   # After legit server teleports (join/respawn/world change) — setbacks do not apply this
  velocity-ms: 500   # After knockback/explosion
  blockstate-ms: 550 # After block state change (bridging needs longer grace)
  potion-ms: 700     # After speed/jump potion effect
  # Grace windows grow with the player's measured ping: window + min(ping * factor, cap-ms).
  # A 200ms-ping player gets +100ms on every window above (factor 0.5), capped at cap-ms.
  ping-scaling:
    enabled: true
    factor: 0.5
    cap-ms: 150

# Client platform/version compatibility. Adjustments here only ever EXEMPT or LOOSEN —
# a misdetected client can cause a missed flag, never a false one.
compat:
  bedrock:
    enabled: true                    # Detect Geyser/Floodgate players (API > UUID > brand)
    exempt-aim-checks: true          # Touch/controller aim breaks Java mouse heuristics — skip aim checks
    scaffold-buffer-multiplier: 1.5  # Bedrock placement timing differs; require more evidence
    reach-extra: 0.05                # Geyser translation positional slack added to reach margin
  via:
    enabled: true                    # Read client protocol version through ViaVersion when present
    modern-client-leniency: true     # Reserved: leniency rules for newer-than-1.8 clients

# Shared combat context for Reach, Hitbox, KillAura, etc. (not per-check)
combat-analysis:
  enabled: true
  cancel-impossible-hits: true
  join-grace-ms: 5000
  punish-buffer: 25.0
  alert-buffer-spike: 3.0
  alert-format: '{prefix}&e{player} &7failed &cCombatAnalysis &7VL: &f{buffer} &7Reason: &f{reason}'

  reach:
    max-normal-reach: 3.05
    max-lenient-reach: 3.25
    max-very-lenient-reach: 3.45
    max-bad-reach: 3.70

  hitbox-expansion:
    small: 0.03
    medium: 0.06
    full: 0.10
    low-ping-max: 50
    mid-ping-max: 100
    high-ping-max: 160

  scoring:
    clean-score: 0.0
    lenient-score: 0.5
    very-lenient-score: 1.5
    bad-score: 3.0
    impossible-score: 5.0
    low-ping-full-expansion-extra: 1.0
    low-ping-medium-expansion-extra: 0.5
    high-ping-reduction-multiplier: 0.70

  pre-aim:
    ticks: 5
    near-yaw-error: 12.0
    near-pitch-error: 15.0
    strong-yaw-error: 6.0

  accuracy-spike:
    enabled: true
    tracking-error-threshold: 15.0
    attack-error-threshold: 3.0
    severe-tracking-error-threshold: 25.0
    severe-attack-error-threshold: 2.0

  target-switch:
    enabled: true
    quick-switch-ms: 40
    very-quick-switch-ms: 150
    large-angle: 45.0
    perfect-hit-yaw-error: 3.0

  rewind:
    live-position-fallback-expansion-bonus: 0.04

  required-rotation:
    median-threshold-deg: 12.0
    min-samples: 8

  leniency:
    recent-knockback-ms: 300
    recent-knockback-suspicion-multiplier: 0.75
    target-recent-velocity-ms: 300

  buffers:
    decay-per-second: 0.25
    cancel-buffer: 8.0
    alert-buffer: 15.0
    max-buffer: 30.0

  alerts:
    enabled: true
    cooldown-ms: 3000
    debug: false

  false-positive:
    join-skip-ms: 5000
    teleport-skip-ms: 750
    teleport-lenient-impossible: true
    close-range-blocks: 1.2
    high-attacker-ping: 250
    high-target-ping: 250
    tps-reduce-threshold: 18.5
    tps-alert-suppress-threshold: 17.5
    tps-suspicion-multiplier: 0.50
    attacker-ping-aim-multiplier: 0.35
    target-ping-reach-multiplier: 0.50
    close-range-aim-multiplier: 0.60
    tight-space-multiplier: 0.70
    near-block-multiplier: 0.80
    velocity-multiplier: 0.75
    vertical-offset-multiplier: 0.75
    vertical-offset-blocks: 1.5
    recent-teleport-multiplier: 0.50

  attack-window-ms: 325
  rewind-base-ms: 70
  rewind-ping-factor: 0.25
  max-rewind-ms: 180
  trade-window-ms: 450
  combo-window-ms: 800
  jump-reset-window-ms: 450
  jump-combat-window-ms: 950
  blockhit-window-ms: 250
  walk-through-distance: 1.1
  packet-burst-ms: 110
  packet-burst-jitter-ms: 18.0
  high-jitter-ms: 12.0
  stale-move-ms: 150
  stale-rotation-ms: 140
  stale-swing-ms: 180
  trade-depth-window-ms: 1200
  spacing-shift-threshold: 0.28
  triple-hit-fast-ms: 350
  triple-hit-delay-ms: 525
  combat-spam-window-ms: 900
  combat-spam-min-attacks: 4
  spacing-attack-window-ms: 650
  counterstrafe-window-ms: 450
  spacing-backward-min-angle: 110.0
  spacing-min-speed: 0.04
  hit-select:
    parry-min-ms: 100
    parry-max-ms: 250
    quarter-min-ms: 500
    quarter-max-ms: 1000
    deep-min-ms: 1000
movement-analysis:
  packet-burst-ms: 110
  high-jitter-ms: 12.0
  eat-movement-grace-ms: 1400
  jump-window-ms: 320
  jump-arc-window-ms: 950
  jump-arc-max-horizontal: 1.08
  jump-arc-min-dy: -0.82
  jump-arc-max-dy: 0.55
  jump-arc-max-offset: 0.52
  fall-arc-window-ms: 2800
  fall-land-grace-ms: 750
  fall-arc-min-drop: 0.75
  fall-arc-max-offset: 0.62
  fall-arc-landing-max-offset: 0.85
  fall-damage-setback-grace-ms: 800
  fall-arc-max-horizontal: 1.12
  fall-arc-min-dy: -1.05
  fall-arc-max-dy: 0.42
  speed-micro-ratio-min: 1.008
  speed-gain-min: 0.022
  sprint-jump-grace-window-ms: 950
  sprint-jump-min-dy: -0.78
  sprint-jump-rise-slack: 0.08
  ladder-legit-max-dy: 0.22
  ladder-legit-max-voff: 0.12
  ladder-blatant-dy: 0.28
  sprint-jump-base-horizontal: 0.12
  sprint-jump-horizontal-per-tick: 0.40
  sprint-jump-speed-potion-horizontal: 0.05
  jump-phase-window-ms: 420
  jump-phase-min-dy: -0.14
  jump-phase-rise-slack: 0.035
  jump-phase-max-horizontal: 0.82
  jump-phase-extra-horizontal-per-tick: 0.18
  fly-physics:
    bob-min-air-ms: 1300
    bob-min-reversals: 3
    bob-min-amplitude: 0.06
    bob-min-vertical-offset: 0.04
    burst-velocity-window-ms: 700
    gravity-sample-size: 12
  velocity-window-ms: 500
  explosion-window-ms: 900
  combat-window-ms: 400
  block-place-window-ms: 250
combat:
  killaura:
    share-vl: true
    aggregate-own-public-flags: true
    public-flag-rearm-ms: 0
    public-suppression-state-min-gap-ms: 0
timer:
  share-vl: true
nofall:
  # auto = read gamerule when available; set false when your server disables fall damage
  fall-damage-enabled: auto
  # Worlds treated as no fall damage for fall-arc / landing prediction grace (speed/fly cheats still flag).
  no-damage-worlds:
    - world
    - arena
  min-fall-distance: 2.9
  damage-wait-ms: 140
  damage-window-ms: 1000
  blink-min-gap-ms: 120
  min-blink-drop: 3.0
  ground-spoof:
    min-descent-dy: -0.04
    descent-ticks-to-flag: 3
    cumulative-descent-min: 0.12
# Grim-style offset movement prediction engine.
# When enabled, the *Prediction movement sub-checks (Speed/Fly/Phase/GroundSpoof/NoSlow and
# the aggregate OffsetPrediction) read the decomposed offset from this engine instead of the
# legacy heuristic processor. Disable to fall back to the old prediction path.
# Grim-style movement prediction engine (FlyPrediction, SpeedPrediction, OffsetPrediction, ...)
engine:
  enabled: true  # false = legacy movement checks only
  shadow-legacy-duplicates: true  # true = skip FlyA-F/SpeedA-D when engine is on
  # ENGINE SOLE AUTHORITY: the prediction engine is THE movement speed authority. The legacy
  # heuristic PredictionProcessor.handleMovement is OFF by default (true below = engine-only,
  # keeps only the velocity-session bridge). Set to false ONLY as an emergency kill-switch to
  # demote the engine and re-enable the legacy heuristic.
  skip-legacy-movement-prediction: true
  # Maintain a packet-synced block-change overlay (BLOCK_CHANGE / MULTI_BLOCK_CHANGE) on top of
  # the live world so collision sees latency-compensated blocks (defeats ghost-block phase).
  world-cache: true
  # Capture knockback/explosion directly from outgoing ENTITY_VELOCITY / EXPLOSION packets and
  # fold them into the prediction (more accurate than Bukkit PlayerVelocityEvent).
  packet-knockback: true
  # After the anticheat sends its OWN setback correction velocity, ignore outgoing EntityVelocity for this
  # long so it is not re-ingested as a real knockback (self-feedback guard). Keep small.
  packet-knockback-self-suppress-ms: 120
  # How long after a knockback/explosion packet it is folded into the next movement tick.
  knockback-window-ms: 550
  knockback-grace-ms: 300
  combat-movement-grace-ms: 450
  advantage-decay: 0.999  # (legacy, unused by long-window accumulator; kept for compat)
  advantage-threshold: 0.001
  # LONG-WINDOW OFFSET ADVANTAGE: each tick's reduced offset above advantage-threshold accrues into
  # a slow-decaying accumulator (catches sustained sub-threshold speed ~ratio 1.003-1.006). Clean
  # ticks bleed it off at clean-decay-per-second (fraction per clean second), NOT a hard reset; it
  # survives teleports and is zeroed only when a setback executes.
  advantage-clean-decay-per-second: 0.25
  advantage-cap: 2.0
  illegal-sprint-threshold: 0.14
  illegal-sneak-threshold: 0.04
  # COMPENSATION BUDGET CAP: clamp TOTAL stacked uncertainty leniency so multiple compensation
  # triggers (block-update + multi-packet + 0.03 + hidden-ground) cannot be farmed together to mask
  # a real offset. Default 0.12 blocks; aggressive profiles use 0.08. Teleport lenience is exempt.
  compensation:
    leniency-budget-cap: 0.12
  exemption-caps:
    block-change-max-ticks: 6
    block-change-window-ms: 2000
    combat-grace-max-ticks: 8
    combat-grace-window-ms: 2000
  vehicle:
    boat-max-per-tick: 0.65
    minecart-max-per-tick: 0.50
    default-max-per-tick: 0.55
    tolerance: 1.15
    buffer-to-flag: 4
  # CHUNK-UNLOAD HANDLING: instead of skipping validation when chunks are unloaded, enter an
  # "unverified" mode that still accrues horizontal motion into the offset advantage and forces a
  # resync setback if the unverified streak persists beyond max-ticks.
  unverified:
    max-ticks: 20
    horizontal-accrual-floor: 0.20
    accrual-factor: 0.5
  player-clock:
    enabled: true
    flag-ahead-ms: 110
    max-drift-ms: 150
    cancel-packet: true
    cancel-packet-min-drift-ms: 150
    setback: true
    setback-min-drift-ms: 200
    # PERSISTENT DRIFT LEDGER: cumulative clock drift that is NOT reset by teleports (accrual pauses)
    # or movement gaps (bounded debit only) so timer cheats cannot farm-and-reset. ledger-cap-ms caps
    # the ledger; ledger-debit-cap-ms bounds how much a single behind-tick can credit back; a gap
    # >= gap-debit-trigger-ms debits gap-debit-ms (never a full reset).
    ledger-cap-ms: 2000
    ledger-debit-cap-ms: 20
    gap-debit-trigger-ms: 225
    gap-debit-ms: 50
    # TimerLimit (Grim analogue): above this ping (ms) the drift ledger stops accruing — extreme latency
    # makes the clock estimate unreliable and farmable. The PredictionNegativeTimer slow-timer check also
    # respects normal lag-gating on top of this.
    timer-limit-abuse-ms: 1000

# Deterministic 1.8.8 movement engine replacement.
movement-engine:
  # Master switch for the prediction-engine movement DETECTION (Simulation tier + Prediction offset
  # checks: Speed/Offset/Fly/Step/Phase/...). Default FALSE because the from-scratch offset engine
  # false-flagged legit movement. Deterministic checks (timer, nofall) do not use it and keep running.
  # Set true to re-enable offset prediction once it is verified false-positive free on your server.
  detection-enabled: false
  velocity-window-ms: 450
  explosion-window-ms: 900
  setback:
    enabled: true
  physics:
    base-move-speed: 0.1
    sprint-multiplier: 1.3
    speed-potion-per-level: 0.2
    slowness-per-level: 0.15
    jump-velocity: 0.42
    jump-boost-velocity-per-level: 0.1
    gravity: 0.08
    vertical-drag: 0.98
    ground-friction-factor: 0.91
    normal-slipperiness: 0.6
    ice-slipperiness: 0.98
    slime-slipperiness: 0.8
    # Vanilla/Grim ground acceleration numerator: groundSpeed = moveSpeed * (0.21600002 / friction^3).
    ground-acceleration-numerator: 0.21600002
    air-acceleration: 0.02
    # Grim sprint air acceleration is 0.025999999 (= 0.02 + 0.006).
    sprint-air-acceleration-bonus: 0.006
    water-drag: 0.8
    lava-drag: 0.5
    liquid-acceleration: 0.02
    web-horizontal-multiplier: 0.25
    web-vertical-multiplier: 0.05
    ladder-horizontal-clamp: 0.15
    ladder-down-clamp: -0.15
    ladder-wall-climb-up: 0.2
    math-epsilon: 0.00001
    collision-tolerance: 0.03
    # Only offset above advantage-floor accrues into the sustained-speed accumulator; clean ticks decay it
    # fast. Raised from 0.001 so legit float/collision jitter cannot slowly build a false speed flag.
    advantage-floor: 0.015
    advantage-decay-per-clean-tick: 0.035
    advantage-cap: 3.0
    minor-offset: 0.035
    moderate-offset: 0.12
    blatant-offset: 0.42
    timer-debt-threshold-ms: 120.0

# Blatant movement packet cancel + immediate setback enforcement
movement-enforcement:
  enabled: true

# Polar-style Prism tier mitigation (pattern checks cancel/drop within ~5ms)
prism:
  mitigation-delay-ms: 5
  pattern-window-ms: 8000
  min-perfect-streak-default: 6

# Block movement until server setback is accepted (NoRotate / Disabler counter)
setback-blocker:
  enabled: true
  max-pending-ms: 2000
  # Setback circuit breaker: token-bucket rate limiter. When a player is set back more than
  # max-setbacks times within window-ms, stop teleporting (which loops) and hard-freeze them by
  # re-sending their last valid position until the bucket refills.
  circuit-breaker:
    enabled: true
    max-setbacks: 3
    window-ms: 2000

# Lightweight AI risk scoring + CSV evidence export (shadow by default)
ai:
  enabled: true
  shadow-mode: true
  decay-per-second: 0.35
  mark-score-threshold: 8.0
  evidence:
    enabled: true

# Grim-style combat engine: transaction-anchored entity tracking + lag-compensated reach.
# When enabled, combat checks (Reach/Hitbox/BackTrack/Piercing/Lagrange and KillAura A/D)
# validate against the exact entity position the client saw at attack time, rewound by the
# last acknowledged transaction. Falls back to the legacy position-history rewind for any
# untracked target (mobs that just spawned, etc.) so behaviour is never worse than before.
# Coexist with Vulcan on the same PacketEvents plugin (no second Netty inject).
# mode: auto = enable when Vulcan.jar is present | true | false
integrations:
  vulcan:
    mode: auto
    hook-delay-ticks: 40
    disable-transactions: true
    skip-transaction-listener: true
    receive-priority: LOWEST

# Rolling combat history + reach classification for silent-aim evidence (no VL yet)
combat-analyzer:
  enabled: true

# Aim heuristics (CharSilentAim, CharAimSnap/Reset/Center/Correlation/Sensitivity, CharAimAssistA/B/C and
# the combat-analyzer) are ENABLED. Detection runs; enforcement aggressiveness is bounded by each
# check's combatMitigation/shadow flags AND punish.safety-mode (silent/alerts-only/mitigation/banwave),
# so turning detection on does NOT auto-ban. Reach, criticals, timer, badpackets are NOT affected by this.
combat:
  aim-heuristics-enabled: true

# Lag-compensated reach/entity tracking for combat checks
combat-engine:
  enabled: true  # false = legacy position-history rewind only
  # Floor on the effective reach limit (blocks, eye -> expanded hitbox). Prevents legit ~3.0-block hits on
  # moving targets from false-flagging at high ping. Blatant reach above this still flags.
  min-reach-limit: 3.3
  # Send a window-confirmation ("transaction") each tick and time the echo for ping rewind.
  # Disable to anchor entity snapshots by wall-clock time instead of transaction acks.
  transactions: true
  # Track server->client entity spawn/move/teleport/metadata/destroy packets into a per-viewer
  # CompensatedEntities buffer used by the rewind.
  entity-tracking: true
  # Transaction sequences to include around the client's last ack when reconstructing the
  # position window (covers interpolation + 1-tick send latency). Higher = more lenient.
  rewind-bracket-back: 2
  rewind-bracket-forward: 1
  # GrimAC ReachInterpolationData analogue: also test positions interpolated BETWEEN consecutive
  # in-bracket snapshots (a target can be mid-tick on the attacker's screen). Only lowers the rewound
  # distance — pure leniency for fast/high-ping targets, never a new flag. Steps mirror Grim's living
  # entity interpolation (3).
  interpolation-enabled: true
  interpolation-steps: 3
  # Hard cap on how far back the rewind may look (ms), for both the engine and legacy fallback.
  max-rewind-ms: 800
  # Legacy-fallback rewind window (only used when a target is untracked): base + ping * factor.
  fallback-rewind-base-ms: 60
  fallback-rewind-ping-factor: 0.5
  reach-1_8-margin: 0.1
  block-impossible-hits: true
  block-impossible-confidence: 0.85

prediction:
  enabled: true
  debug: false
  offset:
    horizontal-threshold: 0.06
    vertical-threshold: 0.08
    velocity-extra-horizontal: 0.10
  fly:
    hover-dy: 0.0045
  no-slow:
    max-horizontal: 0.21
    engine-horizontal: 0.025
  ground-spoof:
    min-dy: 0.05
  phase:
    min-solid-overlaps: 3
    min-path-solids: 2
  compensation:
    hidden-ground-max-dy: 0.085
    extra-horizontal: 0.045
    extra-vertical: 0.070
    ground-update-window-ms: 400
    ground-update-radius: 1
  simulation:
    horizontal-tolerance: 0.024
    vertical-tolerance: 0.045
    horizontal-outside-threshold: 0.018
    vertical-outside-threshold: 0.03
    velocity-carry-ms: 175
    carry-horizontal-extra: 0.02
    jump-carry-horizontal-extra: 0.015
    carry-vertical-extra: 0.04
    carry-vertical-min: -0.98
    shared-max-buffer: 12
    share-classic-vl: true
