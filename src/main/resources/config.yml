# Ban ladder, banwave, and evidence scoring (check VL thresholds are in checks.yml)
punish:
  enabled: true  # false = flag only, no bans (overrides safety-mode below)
  # THE one knob that decides how far the anticheat may act on a flag:
  #   silent       - record flags internally only (no staff chat, no setbacks, no bans)
  #   alerts-only  - + staff chat alerts
  #   mitigation   - + setbacks / hit-drops on flag (recommended first week)
  #   banwave      - + evidence scoring and delayed banwave punishment (default)
  #   instant      - + immediate execution allowed (NEVER enable before staging tests)
  safety-mode: banwave
  # Defer punishment execution while the server is lagging (retries automatically).
  lag-gate:
    enabled: true
    retry-delay-ms: 120000
  ban-vl: 25   # Total VL before punishment ladder runs
  mode: CHECK
  execution:
    type: BANWAVE
    auto-banwave:
      enabled: true
      interval-seconds: 30
      min-delay-seconds: 900
      max-delay-seconds: 7200
      batch-size: 8
    hybrid:
      enabled: true
      blatant-vl: 35
      window-seconds: 180
      min-flags: 6
      min-hot-checks: 1
      min-check-vl: 10.0
      blatant-bed-nuker:
        enabled: true
        incidents: 2
        window-seconds: 120
        dedupe-ms: 3000
  evidence:
    mark-score: 8.0
    queue-score: 12.0
    recent-window-seconds: 600
    multi-check-bonus: 1.75
    triple-check-bonus: 2.5
    global-vl: 35
    global-bonus: 1.5
    marked-bonus: 1.75
    fast-flags:
      count: 6
      window-seconds: 90
      bonus: 2.5
    default: MEDIUM
    confidence:
      HIGH:
        min-check-vl: 5.0
        score: 4.75
        max-contribution: 9.5
      MEDIUM:
        min-check-vl: 7.5
        score: 3.0
        max-contribution: 6.0
      LOW:
        min-check-vl: 10.0
        score: 1.75
        max-contribution: 3.5
    categories:
      REACH: HIGH
      BACKTRACK: HIGH
      LAGRANGE: HIGH
      SIMULATION: HIGH
      FLY: HIGH
      NUKER: HIGH
      KILLAURA: MEDIUM
      SCAFFOLD: MEDIUM
      ANTIKB: MEDIUM
      VELOCITY: MEDIUM
      SPEED: MEDIUM
      PHASE: MEDIUM
      BADPACKETS: MEDIUM
      AIMASSIST: LOW
      AUTOCLICK: LOW
      TIMER: LOW
      NOROTATION: LOW
      BLINK: LOW
      INVENTORY: LOW
      BEDWARS: HIGH
      MISC: MEDIUM
    overrides:
      ReachA: HIGH
      ReachB: HIGH
      ReachC: MEDIUM
      BackTrackA: HIGH
      LagrangeA: HIGH
      LagrangeB: HIGH
      FlyA: HIGH
