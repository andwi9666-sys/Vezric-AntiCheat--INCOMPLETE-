    max-tracked-debt-ms: 450
    reset-gap-ms: 160
    focus-reset-gap-ms: 225
    focus-reset-lag-score: 0.9
  setback:
    enabled: true
    # MASTER ENFORCEMENT SWITCH for movement + velocity setbacks. Default FALSE: the prediction engine
    # still detects and ALERTS (VL accrues), but it will NOT teleport/setback the player. This guards
    # against the movement-prediction false positives. Set to true ONLY after confirming, via the alert
    # offsets, that legit movement no longer flags. (Combat reach/aim packet-drops are unaffected.)
    enforce: false
    cooldown-ms: 0
    teleport-exempt-ms: 900
    max-valid-age-ms: 2500
    valid-engine-offset: 0.12  # Engine offset at/below this on ground = valid anchor sample
    # GrimAC-faithful setback (movement + unified velocity). preserve-velocity re-sends the carried/
    # knockback velocity as an EntityVelocity packet so a setback never eats knockback. simulate advances
    # the anchor by one collided+frictioned tick of that velocity. transaction-confirmed keeps movement
    # blocked until the client acks a transaction sent after the teleport (vs position-distance only).
    preserve-velocity: true
    simulate: true
    transaction-confirmed: true
    simulation-cooldown-ms: 0
    simulation-teleport-exempt-ms: 0
    timer-cooldown-ms: 0
