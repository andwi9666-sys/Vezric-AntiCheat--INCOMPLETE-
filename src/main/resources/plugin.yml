name: Perplexion
version: '${project.version}'
main: com.colin.vezanticheat.VezAntiCheat
api-version: '1.8'
# PacketEvents must own Netty injection — do not call setAPI/init from this plugin when using depend.
depend: [packetevents]
softdepend: [Vulcan, ProtocolLib, ProtocolSupport, ViaVersion, ViaBackwards, ViaRewind, Geyser-Spigot]
commands:
  perplexion:
    description: Main Perplexion AntiCheat command
    usage: /perplexion <status|profile|reload|checks|perf|trace|info|tune|recommendations|exportdebug|...>
    aliases: [pe, vez]
  alerts:
    description: Toggle anticheat alerts
    usage: /alerts
    permission: vez.staff
  flags:
    description: Open flag history or toggle alerts
    usage: /flags [player]
    permission: vez.staff
  banwave:
    description: Banwave management
    usage: /banwave <status|run|clear|list>
    permission: vez.admin
permissions:
  vez.admin:
    description: Full admin access
    default: op
  vez.staff:
    description: Staff alerts access
    default: op
  watchdog.staff:
    description: Legacy staff permission (honored for backward compatibility)
    default: op
  vez.bypass:
    description: Bypass all checks
    default: false
  watchdog.bypass:
    description: Legacy bypass permission (honored for backward compatibility)
    default: false
