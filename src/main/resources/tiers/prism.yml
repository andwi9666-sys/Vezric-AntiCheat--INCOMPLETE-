  bufferToFlag: 4
  decay: 0.15
  setbackEnabled: true
  mitigation: moderate
  cancelOnFlag: true
  setbackOnFlag: true
  setbackDelayMs: 5
  # Player-hit combat checks use combat-mitigation in config.yml (drop hits + punitive setback)

