tiers-version: 2

defaults:
  tier: PRISM
  enabled: true
  shadow: false
  punishVl: 40
  failWeight: 1.0
  bufferToFlag: 4
  decay: 0.15
  setbackEnabled: true
  mitigation: moderate
  cancelOnFlag: true
  setbackOnFlag: true
  setbackDelayMs: 5
  # Player-hit combat checks use combat-mitigation in config.yml (drop hits + punitive setback)

PrismAimModulo360:
  tier: PRISM
  enabled: true
  punishVl: 40
  bufferToFlag: 3  # Deterministic yaw-wrap signature; needs only a few hits
  setbackEnabled: false  # Rotation anomaly — alert, do not setback movement
  cancelOnFlag: false
  setbackOnFlag: false
  wrapDeltaMin: 320.0  # Raw yaw jump (deg) indicating a % 360 wrap (Grim AimModulo360)
  priorDeltaMax: 30.0  # Previous packet must have been a calm rotation
  vl: 1.0

PrismAimDuplicate:
  tier: PRISM
  enabled: true
  punishVl: 40
  bufferToFlag: 6  # Conservative: redundant identical look packets can be bursty
  setbackEnabled: false  # Alerts only by default until validated on your playerbase
  cancelOnFlag: false
  setbackOnFlag: false
  positionGuardMs: 60  # Skip look packets within this window of a position move (straight-line walk)
  combatWindowMs: 1500  # Only evaluate within this long after an attack
  vl: 1.0

PrismInteractionLegality:
  tier: PRISM
  enabled: true
  punishVl: 40
  bufferToFlag: 3
  combatMitigation: true
  maxReach: 3.05
  reachMargin: 0.0
  vanillaExpansion: 0.1
  cancelMissDistance: 0.10
  graceThreshold: 0.04
  cancelOnFlag: true
  blatantReachOver: 0.30
  hitboxMinSamples: 6
  missRatioThreshold: 0.45
  hitboxViolationsToFlag: 2
  lagrangeMinConfidence: 2.0
  backtrackMaxStaleMs: 190
  noRotationMaxAgeMs: 165
  rotationRayMinAngle: 12.0
  # Absorbs (tune here, not ghost keys): PrismReachA/B/C, PrismHitboxA/B,
  # PrismBackTrack, PrismLagRange, PrismNoRotationA/B/C, PrismRotationRay

PrismScaffoldA:
  tier: PRISM
  enabled: true
  # Scaffold -- silent placement-legality & line-of-sight detector. Diagnostics/verbose only;
  # never cancels, setbacks, or prevents bridging.
  punishVl: 40
  shadow: true
  setbackEnabled: false
  cancelOnFlag: false
  setbackOnFlag: false
  verboseEvidence: true
  debug: false
  maxSamples: 24
  minBridgeSequence: 4
  minSamples: 7
  bufferToFlag: 8
  bufferDecay: 0.55
  flagCooldownMs: 2500
  # raytrace / line-of-sight (tolerant: detects not-looking-at-the-face, not imperfect aim)
  rayTraceReach: 4.65
  rayTraceStep: 0.05
  maxAngleError: 28.0
  hardAngleError: 45.0
  # placement legality
  supportHistoryMs: 1500
  repeatedRelativeStd: 0.035

PrismFastBreakA:
  tier: PRISM
  enabled: true
  punishVl: 40
  toleranceRatio: 0.92
  absoluteAllowanceMs: 55
  minExpectedMs: 100
  bufferToFlag: 2

PrismFastBreakB:
  tier: PRISM
  enabled: true
  punishVl: 40
  sampleSize: 10
  minSamples: 5
  instantBlockMinAvgMs: 80.0
  bufferToFlag: 2

PrismNukerA:
  tier: PRISM
  enabled: true
  punishVl: 40
  bufferToFlag: 2
  maxReach: 5.2
  bedMaxReach: 4.6
  breakWindowMs: 650
  maxBreaksPerWindow: 4

PrismBlockSight:
  tier: PRISM
  enabled: true
  punishVl: 40
  bufferToFlag: 3
  minLookDot: 0.55

PrismScaffoldB:
  tier: PRISM
  enabled: true
  # Silent Eagle sneak-at-edge automation detector.
  punishVl: 40
  shadow: true
  setbackEnabled: false
  cancelOnFlag: false
  setbackOnFlag: false
  verboseEvidence: true
  debug: false
  bufferToFlag: 6
  bufferDecay: 0.45
  flagCooldownMs: 3000
  eagleMinCycles: 7
  edgeMeanMax: 0.075
  edgeStdMax: 0.018
  startStdMaxMs: 18.0
  releaseStdMaxMs: 22.0
  maxStartLeadMs: 550
  maxReleaseDelayMs: 650
  minSignals: 2

PrismScaffoldC:
  tier: PRISM
  enabled: true
  # LegitScaffold -- silent bridge-consistency detector. Diagnostics/verbose only; never cancels,
  # setbacks, or prevents bridging. Strict against long-term robotic consistency, lenient on skill.
  punishVl: 40
  shadow: true
  setbackEnabled: false
  cancelOnFlag: false
  setbackOnFlag: false
  verboseEvidence: true
  debug: false
  minSamples: 7
  minBridgeSequence: 4
  minCategoriesToFlag: 2
  perfectPlacementAllowance: 2
  bufferToFlag: 8
  bufferDecay: 0.55
  flagCooldownMs: 2500
  # timing consistency
  minPlaceIntervalMs: 45.0
  maxPlaceIntervalMs: 650.0
  maxTimingCv: 0.075
  humanTimingCv: 0.13
  maxTimingStdMs: 9.5
  maxTimingSpreadMs: 28.0
  # rotation consistency
  maxPitchRange: 2.85
  maxRotationStd: 1.15
  minRotationDelta: 0.035

PrismScaffoldD:
  tier: PRISM
  enabled: false
  retired: true
  replacement: PrismScaffoldA

PrismScaffoldE:
  tier: PRISM
  enabled: false
  retired: true
  replacement: PrismScaffoldA

PrismInventoryA:
  tier: PRISM
  enabled: true
  punishVl: 40
  setbackEnabled: true
  momentumExemptMs: 500
  openMaxSpeed: 0.30
  momentumTolerance: 0.03
  minResidualSpeed: 0.03
  failVl: 1.0

PrismInventoryB:
  tier: PRISM
  enabled: true
  punishVl: 40
  setbackEnabled: true
  maxClicksPerSec: 12.0
  minSamples: 5
  bufferToFlag: 2
  failVl: 1.5

PrismInventoryC:
  tier: PRISM
  enabled: true
  punishVl: 40
  setbackEnabled: true
  gracePeriodMs: 500
  bufferToFlag: 3
  failVl: 1.2

PrismBadPacketsA:
  tier: PRISM
  enabled: true
  punishVl: 40
  bufferToFlag: 5
  maxAbsPitch: 91.0
  # NaN/infinite rotation needs nanStrikesToFlag occurrences inside nanStrikeWindowMs
  # before flagging — one corrupt packet from a proxy/bad network must never flag alone.
  nanStrikesToFlag: 2
  nanStrikeWindowMs: 30000
  # Invalid rotation = NaN/infinite or pitch outside vanilla bounds. Yaw is cyclic (unwrapped OK).

PrismBadPacketsB:
  tier: PRISM
  enabled: true
  punishVl: 40
  bufferToFlag: 7
  maxDuplicateIntervalMs: 3
  maxTinyIntervalMs: 8
  minNoRotationMs: 220
  swingGraceMs: 350
  # Duplicate packet burst (ignores rotation-only and post-setback resync).

PrismBadPacketsC:
  tier: PRISM
  enabled: true
  punishVl: 40
  bufferToFlag: 6
  attackFreshnessMs: 150
  hardSwingDeltaMs: 120
  lenientSwingDeltaMs: 220
  postAttackSwingMs: 180
  minPendingResolveMs: 45
  cancelNoSwingOnFlag: false
  # Attack without arm swing; validation is deferred to allow same-tick post-attack animation ordering.

PrismBadPacketsD:
  tier: PRISM
  enabled: true
  punishVl: 40
  bufferToFlag: 3
  # Structural bad-packet validation D.

PrismBadPacketsE:
  tier: PRISM
  enabled: true
  punishVl: 40
  bufferToFlag: 3
  # Structural bad-packet validation E.

PrismBadPacketsF:
  tier: PRISM
  enabled: true
  punishVl: 40
  bufferToFlag: 5
  maxStreak: 16
  minPositionlessMs: 400
  # Positionless flying streak (requires sustained movement without coordinates).

PrismBadPacketsG:
  tier: PRISM
  enabled: true
  punishVl: 40
  bufferToFlag: 3
  # Structural bad-packet validation G.

